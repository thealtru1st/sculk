name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install native dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked
      - name: Build x86_64
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --locked -p sculk --target ${{ matrix.target }}
      - name: Build ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --locked -p sculk --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="sculk-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p dist/"$name"
          cp target/${{ matrix.target }}/release/sculk dist/"$name"/
          cp README.md FEATURES.md LICENSE dist/"$name"/
          tar -C dist -czf dist/"$name.tar.gz" "$name"
          cd dist
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: sculk-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Attach tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
