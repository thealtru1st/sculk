[workspace]
members = ["crates/sculk", "crates/sculk-bench"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/thealtru1st/sculk"
homepage = "https://github.com/thealtru1st/sculk"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.0", default-features = false, features = ["zlib"] }
libz-sys = { version = "1.1", default-features = false, features = ["libc"] }
libc = "0.2"
mio = { version = "1.0", features = ["net", "os-poll"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
